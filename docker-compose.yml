services:
  ai-trading-brain:
    build: .
    container_name: ai-trading-brain
    # restart: unless-stopped ensures Docker auto-restarts the container if the
    # process exits cleanly (SIGTERM from host/OOM/daemon restart) or crashes.
    # NOTE: if systemd also manages this service, disable one to avoid duplicates.
    restart: unless-stopped
    # Delete any stale PID file left in the volume-mounted data/ directory before
    # starting.  Without this, a previous run's {"pid": 1} lock survives container
    # teardown and causes an infinite restart loop (os.kill(1, 0) always succeeds
    # on Linux; the stale-lock detection in instance_lock.py never fires).
    # `exec` replaces the shell so python is PID 1 and receives SIGTERM directly.
    # PAPER_TRADING is read from .env — do not hardcode --paper here.
    command: >
      sh -c "rm -f /app/data/trading_engine.pid /tmp/trading_engine.pid && exec python main.py --schedule"
    
    # Mounted volumes for persistent data
    volumes:
      # Trade records, logs, databases
      - ./data:/app/data
      
      # Mount .env read-write so Telegram /token command can persist the token
      - .env:/app/.env:rw
    
    # Environment variables
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Kolkata  # IST — all schedule times are in IST
      - RUNNING_IN_DOCKER=1  # Required — main.py exits if this is absent
    
    # Resource limits — 3 g headroom for KEL rebuild, AMLS, and research ops
    mem_limit: 3g
    cpus: '1.0'

    # File descriptor limit — default ulimit of 1024 is exhausted by yfinance's
    # SQLite timezone-cache leaking handles over long uptime.  65536 gives ~18hrs
    # of headroom while the root-cause fix (yfinance FD cleanup) is deployed.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    
    # Health check — verify PID lock exists (process is alive and holds the lock)
    healthcheck:
      test: ["CMD", "sh", "-c", "test -f /app/data/trading_engine.pid && kill -0 $(cat /app/data/trading_engine.pid) 2>/dev/null || (test -f /tmp/trading_engine.pid && kill -0 $(cat /tmp/trading_engine.pid) 2>/dev/null)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    
    # Network
    networks:
      - trading-network

  # Optional: Monitoring/Dashboard container
  streamlit-dashboard:
    build: .
    container_name: trading-dashboard
    restart: always
    
    command: streamlit run control_tower/dashboard_app.py --server.port=8501 --server.address=0.0.0.0
    
    volumes:
      - ./data:/app/data:ro
      - ./control_tower:/app/control_tower:ro
      - .env:/app/.env:ro          # GAP-026: dashboard reads config env vars

    environment:
      - TZ=Asia/Kolkata   # Match trading brain — all timestamps are IST

    mem_limit: 1g
    cpus: '0.5'

    ports:
      - "8501:8501"  # Streamlit dashboard
    
    mem_limit: 1g
    cpus: '0.5'
    
    networks:
      - trading-network
    
    depends_on:
      - ai-trading-brain

networks:
  trading-network:
    driver: bridge

volumes:
  trading_data:
    driver: local
