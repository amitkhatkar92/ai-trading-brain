# =============================================================================
# IIOS — Investment Intelligence Operating System
# pyproject.toml — Complete project and toolchain configuration
# Foundation: IIOS-FCR-001 (CERTIFIED)
# =============================================================================

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

# =============================================================================
# Project Metadata
# =============================================================================
[project]
name = "iios"
version = "0.1.0"
description = "Investment Intelligence Operating System — 17-layer hierarchical multi-agent trading system for NSE/BSE"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "IIOS Architecture Council" },
]
maintainers = [
    { name = "IIOS Engineering Team" },
]
keywords = [
    "trading", "algorithmic-trading", "multi-agent", "ai",
    "quantitative-finance", "nse", "india", "dhan",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
]
requires-python = ">=3.12"

dependencies = [
    # --- Environment ---------------------------------------------------------
    "python-dotenv>=1.0.0",

    # --- Scheduling ----------------------------------------------------------
    "schedule>=1.2.0",

    # --- Data / Analysis -----------------------------------------------------
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",

    # --- Market Data Feeds ---------------------------------------------------
    "yfinance>=0.2.40",
    "nsepython>=1.0",

    # --- Machine Learning (k-NN regime predictor, strategy evolution) --------
    "scikit-learn>=1.3.0",

    # --- Technical Analysis --------------------------------------------------
    "ta>=0.11.0",

    # --- Broker SDKs ---------------------------------------------------------
    "dhanhq==2.2.0",
    "kiteconnect>=4.2.0",
    "smartapi-python>=1.3.7",
    "pyotp>=2.9.0",
    "logzero>=1.7.0",

    # --- HTTP / WebSocket ----------------------------------------------------
    "requests>=2.31.0",
    "websocket-client>=1.6.0",
    "urllib3>=2.2.0",

    # --- Telegram Bot (13 IIOS operator commands) ----------------------------
    "python-telegram-bot>=20.7",

    # --- Dashboard (Layer 17 ControlTower) -----------------------------------
    "streamlit>=1.32.0",
    "plotly>=5.20.0",

    # --- Logging -------------------------------------------------------------
    "loguru>=0.7.0",

    # --- Cryptography (INFRA-ENC-001) ----------------------------------------
    "cryptography>=42.0.0",

    # --- Utilities -----------------------------------------------------------
    "tqdm>=4.66.0",
    "pytz>=2024.1",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "iios[test,lint,types,security]",
    "ipython>=8.22.0",
    "rich>=13.7.0",
    "watchdog>=4.0.0",
    "pre-commit>=3.7.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.12.0",
    "pytest-benchmark>=4.0.0",
    "pytest-timeout>=2.3.0",
    "hypothesis>=6.100.0",
    "freezegun>=1.4.0",
    "responses>=0.25.0",
    "time-machine>=2.14.0",
]
lint = [
    "black>=24.3.0",
    "isort>=5.13.0",
    "ruff>=0.4.0",
    "flake8>=7.0.0",
    "flake8-bugbear>=24.2.0",
    "flake8-annotations>=3.0.0",
]
types = [
    "mypy>=1.9.0",
    "pandas-stubs>=2.1.0",
    "types-requests>=2.31.0",
    "types-pytz>=2024.1.0",
    "types-python-dateutil>=2.9.0",
    "types-tqdm>=4.66.0",
]
security = [
    "detect-secrets>=1.4.0",
    "bandit[toml]>=1.7.0",
    "pip-audit>=2.7.0",
    "safety>=3.1.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
]

[project.urls]
"Homepage"      = "https://github.com/your-org/iios"
"Documentation" = "https://github.com/your-org/iios/blob/main/DEVELOPMENT.md"
"Architecture"  = "https://github.com/your-org/iios/blob/main/ARCHITECTURE.md"
"Foundation"    = "https://github.com/your-org/iios/blob/main/FOUNDATION_CERTIFICATION.md"
"Bug Tracker"   = "https://github.com/your-org/iios/issues"
"Changelog"     = "https://github.com/your-org/iios/blob/main/CHANGELOG.md"

[project.scripts]
iios-run         = "run:main"
iios-dev         = "dev:main"
iios-healthcheck = "healthcheck:main"
iios-bootstrap   = "bootstrap:main"

# =============================================================================
# Package Discovery
# =============================================================================
[tool.setuptools.packages.find]
where   = ["."]
include = ["iios*"]
exclude = ["tests*", "docs*", "scripts*"]

[tool.setuptools.package-data]
"iios" = ["py.typed", "**/*.yaml", "**/*.json"]

# =============================================================================
# Black — Code Formatter
# =============================================================================
[tool.black]
line-length    = 100
target-version = ["py312", "py313"]
include        = '\.pyi?$'
extend-exclude = '''
/(
    \.venv
  | \.git
  | build
  | dist
  | data
  | scripts
  | htmlcov
)/
'''

# =============================================================================
# isort — Import Sorter
# =============================================================================
[tool.isort]
profile             = "black"
line_length         = 100
known_first_party   = ["iios"]
known_third_party   = [
    "pandas", "numpy", "scipy", "sklearn",
    "yfinance", "dhanhq", "kiteconnect",
    "requests", "streamlit", "loguru",
    "telegram", "schedule", "ta",
    "cryptography", "dotenv", "pytz",
]
combine_as_imports  = true
force_grid_wrap     = 0
force_sort_within_sections = true

# =============================================================================
# Ruff — Fast Linter
# =============================================================================
[tool.ruff]
line-length    = 100
target-version = "py312"
src            = ["iios", "tests"]
exclude        = [
    ".venv", ".git", "build", "dist", "data",
    "__pycache__", "*.egg-info", "htmlcov",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "S",    # flake8-bandit (security)
    "ANN",  # flake8-annotations
    "T20",  # flake8-print (no print statements in lib code)
    "RUF",  # Ruff-specific rules
]
ignore = [
    "S101",   # assert allowed in tests
    "ANN101", # self type annotation not required
    "ANN102", # cls type annotation not required
    "T201",   # print allowed in scripts
]

[tool.ruff.lint.per-file-ignores]
"tests/**"     = ["S101", "ANN", "B", "T20"]
"run.py"       = ["T20", "ANN"]
"dev.py"       = ["T20", "ANN"]
"healthcheck.py" = ["T20", "ANN"]
"bootstrap.py" = ["T20", "ANN"]
"scripts/**"   = ["T20", "ANN", "S"]

[tool.ruff.lint.isort]
known-first-party = ["iios"]

# =============================================================================
# mypy — Type Checker
# =============================================================================
[tool.mypy]
python_version         = "3.12"
strict                 = true
warn_return_any        = true
warn_unused_configs    = true
warn_unused_ignores    = true
warn_redundant_casts   = true
warn_unreachable       = true
disallow_untyped_defs  = true
disallow_incomplete_defs = true
check_untyped_defs     = true
disallow_untyped_decorators = true
no_implicit_optional   = true
no_implicit_reexport   = true
namespace_packages     = true
explicit_package_bases = true
files                  = ["iios/", "tests/"]

[[tool.mypy.overrides]]
module = [
    "yfinance.*", "dhanhq.*", "kiteconnect.*",
    "streamlit.*", "sklearn.*", "scipy.*",
    "nsepython.*", "telegram.*", "schedule.*",
    "logzero.*", "smartapi.*", "pyotp.*",
    "tqdm.*", "websocket.*", "loguru.*",
    "ta.*", "plotly.*",
]
ignore_missing_imports = true

# =============================================================================
# pytest — Test Runner
# =============================================================================
[tool.pytest.ini_options]
testpaths     = ["tests"]
python_files  = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--tb=short",
]
markers = [
    "unit: Unit tests (fast, mocked dependencies)",
    "integration: Integration tests (multi-layer, real dependencies)",
    "performance: Benchmark tests (latency SLA validation)",
    "security: Security compliance tests (OWASP, auth, audit)",
    "slow: Long-running tests (> 5 seconds)",
    "requires_market: Tests requiring live market data (NSE hours only)",
    "architecture: Architecture invariant tests",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:yfinance",
    "ignore::DeprecationWarning:kiteconnect",
    "ignore::PendingDeprecationWarning",
    "ignore::UserWarning:streamlit",
    "ignore::ResourceWarning:sqlite3",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
# timeout = 30  # Requires pytest-timeout — enable when installed
# asyncio_mode = "auto"  # Requires pytest-asyncio — enable when installed

# =============================================================================
# Coverage
# =============================================================================
[tool.coverage.run]
source   = ["iios"]
branch   = true
omit     = [
    "*/tests/*",
    "*/__pycache__/*",
    "iios/api/*",
    "iios/replay/*",
]
parallel = true
data_file = ".coverage"

[tool.coverage.report]
fail_under   = 95
show_missing = true
skip_covered = false
precision    = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
    "\\.\\.\\.",
    "pass$",
    "\\# noqa: .*",
]

[tool.coverage.html]
directory  = "htmlcov"
title      = "IIOS Coverage Report"

[tool.coverage.xml]
output = "coverage.xml"

# =============================================================================
# Bandit — Security Linting
# =============================================================================
[tool.bandit]
targets   = ["iios"]
skips     = ["B101", "B601"]
recursive = true

# =============================================================================
# Project Custom Metadata
# =============================================================================
[tool.iios]
architecture_version  = "1.0"
engineering_version   = "1.0"
implementation_version = "0.1.0"
foundation_document   = "IIOS-FCR-001"
certification_status  = "FOUNDATION_CERTIFIED"
waves_total           = 20
layers_total          = 17
agents_total          = 62
infrastructure_services = 46
decision_threshold    = 6.5
vix_kill_threshold    = 45.0
daily_loss_pct        = 0.02
paper_trades_path     = "data/paper_trades.csv"
database_path         = "data/iios.db"
