# =============================================================================
# IIOS — .pre-commit-config.yaml
# Pre-commit hooks enforcing all Foundation Constitution security and quality rules.
# Install: pre-commit install
# Run manually: pre-commit run --all-files
# Foundation: IIOS-FCR-001 (CERTIFIED) — FC-RULE-041, FC-RULE-048, FC-RULE-060
# =============================================================================

default_language_version:
  python: python3.12

default_stages: [commit, push]

fail_fast: false

repos:

  # ===========================================================================
  # Standard Hooks
  # ===========================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: '^data/|\.csv$'
      - id: end-of-file-fixer
        exclude: '^data/|\.csv$'
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1000]
        exclude: '^data/'
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: debug-statements            # No pdb/breakpoint in commits
      - id: detect-private-key          # No private keys in commits
      - id: forbid-new-submodules
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: no-commit-to-branch
        args: [--branch=main, --branch=production]
      - id: requirements-txt-fixer      # Sort requirements files

  # ===========================================================================
  # Secret Detection (FC-RULE-041, FC-RULE-048)
  # CRITICAL: Zero secrets in code — this hook is MANDATORY
  # ===========================================================================
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: "SECURITY: detect-secrets scan"
        args: [--baseline, .secrets.baseline]
        exclude: '^\.env\.example$|^\.secrets\.baseline$|^tests/.*fixtures'

  # ===========================================================================
  # Black — Code Formatter (FC-RULE-060 — code quality)
  # ===========================================================================
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        name: "FORMAT: black"
        args: [--line-length=100]
        language_version: python3.12

  # ===========================================================================
  # isort — Import Sorter
  # ===========================================================================
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: "FORMAT: isort"
        args: [--profile=black, --line-length=100]

  # ===========================================================================
  # Ruff — Fast Linter
  # ===========================================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.10
    hooks:
      - id: ruff
        name: "LINT: ruff"
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        name: "FORMAT: ruff-format"

  # ===========================================================================
  # mypy — Type Checking (strict mode for enterprise_ai_platform/ package)
  # ===========================================================================
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        name: "TYPES: mypy (enterprise_ai_platform/)"
        args:
          - --strict
          - --python-version=3.12
          - --ignore-missing-imports
        files: ^enterprise_ai_platform/
        additional_dependencies:
          - pandas-stubs
          - types-requests
          - types-pytz
          - types-python-dateutil

  # ===========================================================================
  # Bandit — Security Linting (OWASP compliance, FC-RULE-050)
  # ===========================================================================
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        name: "SECURITY: bandit"
        args: [-r, --skip=B101, -ll]
        files: ^enterprise_ai_platform/
        exclude: ^tests/

  # ===========================================================================
  # pyupgrade — Keep Python syntax modern
  # ===========================================================================
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.15.2
    hooks:
      - id: pyupgrade
        name: "FORMAT: pyupgrade (py3.12+)"
        args: [--py312-plus]

  # ===========================================================================
  # IIOS-Specific: Hardcoded constant check
  # Enforces FC-RULE-017, FC-RULE-018: no hardcoded thresholds
  # ===========================================================================
  - repo: local
    hooks:
      - id: enterprise_ai_platform-no-hardcoded-thresholds
        name: "IIOS: no hardcoded decision/kill switch thresholds"
        language: pygrep
        entry: '(?<!#)(?:6\.5|45\.0|0\.02|0\.50|0\.80|0\.15)(?!\s*#)'
        types: [python]
        files: ^enterprise_ai_platform/(?!config/)
        exclude: ^tests/|^enterprise_ai_platform/core/constants\.py
        pass_filenames: true

      - id: enterprise_ai_platform-no-direct-config-import
        name: "IIOS: layer boundary check (no cross-layer upward imports)"
        language: pygrep
        entry: 'from enterprise_ai_platform\.(risk|execution|decisions|learning)\.'
        types: [python]
        files: ^enterprise_ai_platform/(core|config|infrastructure|shared|knowledge)/
        pass_filenames: true

      - id: enterprise_ai_platform-no-print-in-library
        name: "IIOS: no print() in library code (use logging)"
        language: pygrep
        entry: '^\s*print\('
        types: [python]
        files: ^enterprise_ai_platform/
        exclude: ^enterprise_ai_platform/cli/|^enterprise_ai_platform/tools/|^enterprise_ai_platform/dashboard/|^tests/
        pass_filenames: true

  # ===========================================================================
  # OIOS-Specific: duplicate class-name guard (2026-09-14 housekeeping audit)
  # oios/ is the subsystem actually wired into live trading
  # (orchestrator/master_orchestrator.py) yet, unlike enterprise_ai_platform/, had zero automated
  # protection against the exact class of bug documented in
  # AI_PLATFORM_ARCHITECTURE_AUDIT_V1.md (two classes sharing a name across
  # modules -> silent except/isinstance failures). Baseline file accepts the
  # 3 pre-existing, manually-verified-harmless duplicates found during that
  # audit; fails only on genuinely NEW duplicate class names going forward.
  # ===========================================================================
  - repo: local
    hooks:
      - id: oios-no-duplicate-class-names
        name: "OIOS: no duplicate class names across modules"
        language: system
        entry: python scripts/check_oios_duplicate_symbols.py
        files: ^oios/.*\.py$
        pass_filenames: false
