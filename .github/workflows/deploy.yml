name: Deploy Trading Brain to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:   # allow manual trigger from GitHub UI

# Prevent concurrent deploys — cancel any in-progress run when a newer push
# arrives, and serialise runs for the same branch so two deploys never race
# on the VPS simultaneously.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  deploy-to-vps:
    runs-on: ubuntu-latest

    # ── notify on failure ────────────────────────────────────────────────────
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate secrets are present
        run: |
          missing=()
          [ -z "${{ secrets.VPS_HOST }}"    ] && missing+=("VPS_HOST")
          [ -z "${{ secrets.VPS_USER }}"    ] && missing+=("VPS_USER")
          [ -z "${{ secrets.VPS_SSH_KEY }}" ] && missing+=("VPS_SSH_KEY")
          [ -z "${{ secrets.VPS_PORT }}"    ] && missing+=("VPS_PORT")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "❌ Missing GitHub secrets: ${missing[*]}"
            echo "Run scripts/setup_github_secret.ps1 locally to configure them."
            exit 1
          fi
          echo "✅ All required secrets present"

      - name: Validate Docker Compose config
        run: docker compose config >/dev/null

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 10m
          script: |
            # pipefail: treat pipe failures (e.g. failed docker build piped to
            # tail) as errors.  Without this, "docker compose build | tail -5"
            # hides a failed build and the script continues with a broken image.
            set -eo pipefail
            cd /root/ai-trading-brain
            echo "=== git sync ==="
            # Delete the remote-tracking ref before every fetch.
            # Rationale: when a manual SSH deploy has already advanced
            # refs/remotes/origin/main to the new SHA, "git fetch --force"
            # still performs a CAS (compare-and-swap) lock check: it reads the
            # current value, then tries to lock with that value as "expected".
            # If the ref was already updated out-of-band, the CAS fails with:
            #   "cannot lock ref '...': is at <new> but expected <old>"
            # --force only suppresses the non-fast-forward guard, NOT the CAS.
            # Solution: delete the ref so git fetch creates it fresh (no CAS
            # check), then reset to FETCH_HEAD to avoid using the tracking ref.
            git update-ref -d refs/remotes/origin/main 2>/dev/null || true
            git fetch origin main
            git reset --hard FETCH_HEAD
            echo "[ git    ] ✅ HEAD=$(git rev-parse --short HEAD)"

            # ═══ Remove stale PID locks ════════════════════════════════════════
            rm -f /root/ai-trading-brain/data/trading_engine.pid
            echo "[ pid    ] ✅ stale locks cleared"

            # ═══ Disk cleanup — prevent accumulated images filling the disk ═══
            # Remove all images not referenced by a running container, plus all
            # dangling build cache.  This runs BEFORE the build so the new image
            # always has room to land.  Running containers are never removed.
            docker image prune -af  2>/dev/null || true
            docker builder prune -af 2>/dev/null || true
            DISK_FREE=$(df -h / | awk 'NR==2{print $4}')
            echo "[ disk   ] ✅ free space after prune: ${DISK_FREE}"

            # ═══ Docker rebuild ════════════════════════════════════════════════
            touch /root/ai-trading-brain/.env
            # Log full build output to a temp file so it is visible on failure.
            docker compose build --no-cache ai-trading-brain > /tmp/build.log 2>&1 \
              || { echo "❌ Docker build FAILED — last 30 lines:"; tail -30 /tmp/build.log; exit 1; }
            echo "[ build  ] ✅ image built"
            tail -3 /tmp/build.log

            # ═══ Container cleanup ════════════════════════════════════════════
            # ORDER MATTERS to avoid two race conditions:
            #
            # Race 1 — "container name already in use":
            #   Docker's restart=unless-stopped can spawn a new container
            #   before compose up runs.  Disable restart policy FIRST.
            #
            # Race 2 — "network already exists":
            #   docker rm -f removes containers but Docker's endpoint registry
            #   takes a moment to propagate the unregistration.  A network rm
            #   immediately after rm -f can still see "active endpoints" and
            #   fail silently.  Fix: sleep 3 + explicit force-disconnect.
            #
            # Step 1 — Strip restart policy so daemon won't re-create
            docker update --restart=no ai-trading-brain trading-dashboard 2>/dev/null || true
            # Step 2 — Compose teardown (manages stop + remove + owned network)
            #          Show tail so failures are visible in GA log
            docker compose down --remove-orphans 2>&1 | tail -10 || true
            # Step 3 — Belt-and-suspenders: remove any container that survived
            docker rm -f ai-trading-brain trading-dashboard 2>/dev/null || true
            # Step 4 — Wait for Docker daemon to settle endpoint unregistration
            sleep 3
            # Step 5 — Force-disconnect any ghost endpoints, then remove network
            docker network disconnect -f ai-trading-brain_trading-network ai-trading-brain 2>/dev/null || true
            docker network disconnect -f ai-trading-brain_trading-network trading-dashboard 2>/dev/null || true
            docker network rm ai-trading-brain_trading-network 2>/dev/null || true
            echo "[ clean  ] ✅ old containers and network removed"

            # ═══ Start fresh ═══════════════════════════════════════════════════
            # --remove-orphans: clean any containers from a previous compose
            # config that are no longer in the current one.
            # --force-recreate: last resort — recreate even if config unchanged.
            docker compose up -d --remove-orphans --force-recreate
            sleep 8
            docker compose ps
            echo "✅ Deployment complete — $(git rev-parse --short HEAD) live"

            # ═══ Post-deploy cleanup — remove images superseded by this build ═
            # The newly built image is now in use; prune everything else.
            docker image prune -af 2>/dev/null || true
            DISK_FREE=$(df -h / | awk 'NR==2{print $4}')
            echo "[ disk   ] ✅ disk free after deploy: ${DISK_FREE}"
