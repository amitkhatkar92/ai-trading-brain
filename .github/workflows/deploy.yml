name: Deploy Trading Brain to VPS

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  deploy-to-vps:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /root/ai-trading-brain
            git fetch origin main
            git reset --hard origin/main

            # ── One-time cleanup: disable systemd service permanently ──────────────
            # The old service set RUNNING_IN_DOCKER=1 which bypassed the Docker guard
            # and allowed main.py to run outside the container.  Kill it for good.
            systemctl stop    trading-brain-schedule 2>/dev/null || true
            systemctl disable trading-brain-schedule 2>/dev/null || true
            rm -f /etc/systemd/system/trading-brain-schedule.service
            systemctl daemon-reload

            # ── Remove any stale PID lock so Docker start is clean ─────────────────
            rm -f /root/ai-trading-brain/data/trading_engine.pid

            # ── Docker-only restart ─────────────────────────────────────────────────
            docker compose down --remove-orphans 2>/dev/null || true
            docker compose up -d --build

            sleep 3
            docker ps --filter name=ai-trading-brain --format "table {{.Names}}\t{{.Status}}"
            echo "✅ Deployment complete — only Docker runtime active"

