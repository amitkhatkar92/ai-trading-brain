name: Deploy Trading Brain to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:   # allow manual trigger from GitHub UI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  deploy-to-vps:
    runs-on: ubuntu-latest

    # ── notify on failure ────────────────────────────────────────────────────
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate secrets are present
        run: |
          missing=()
          [ -z "${{ secrets.VPS_HOST }}"    ] && missing+=("VPS_HOST")
          [ -z "${{ secrets.VPS_USER }}"    ] && missing+=("VPS_USER")
          [ -z "${{ secrets.VPS_SSH_KEY }}" ] && missing+=("VPS_SSH_KEY")
          [ -z "${{ secrets.VPS_PORT }}"    ] && missing+=("VPS_PORT")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "❌ Missing GitHub secrets: ${missing[*]}"
            echo "Run scripts/setup_github_secret.ps1 locally to configure them."
            exit 1
          fi
          echo "✅ All required secrets present"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 10m
          script: |
            set -e
            cd /root/ai-trading-brain
            echo "=== git sync ==="
            # --force bypasses the compare-and-swap ref check that causes:
            # "cannot lock ref 'refs/remotes/origin/main': is at A but expected B"
            # This happens when a previous manual SSH deploy advanced the ref and
            # GitHub Actions then tries to fetch expecting the older SHA.
            # git remote prune (the alternative) only removes deleted-branch refs
            # and does NOT fix a ref that exists at the wrong SHA.
            git fetch --force origin main
            git reset --hard origin/main
            echo "[ git    ] ✅ HEAD=$(git rev-parse --short HEAD)"

            # ═══ Remove stale PID locks ════════════════════════════════════════
            rm -f /root/ai-trading-brain/data/trading_engine.pid
            echo "[ pid    ] ✅ stale locks cleared"

            # ═══ Docker rebuild + restart ══════════════════════════════════════
            touch /root/ai-trading-brain/.env
            docker compose build --no-cache ai-trading-brain 2>&1 | tail -5
            # `down` tears down existing containers *and* the project network so
            # that `up` can re-create the network before starting containers.
            # Using --force-recreate alone does not manage the network lifecycle;
            # if the network was removed (e.g. a previous `docker compose down`
            # or manual `docker network rm`) the containers fail to start with:
            #   "network ai-trading-brain_trading-network not found"
            docker compose down --remove-orphans
            docker compose up -d

            sleep 5
            docker ps --filter name=ai-trading-brain --format "table {{.Names}}\t{{.Status}}"
            echo "✅ Deployment complete — $(git rev-parse --short HEAD) live"

