name: Deploy Trading Brain to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:   # allow manual trigger from GitHub UI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  deploy-to-vps:
    runs-on: ubuntu-latest

    # ── notify on failure ────────────────────────────────────────────────────
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate secrets are present
        run: |
          missing=()
          [ -z "${{ secrets.VPS_HOST }}"    ] && missing+=("VPS_HOST")
          [ -z "${{ secrets.VPS_USER }}"    ] && missing+=("VPS_USER")
          [ -z "${{ secrets.VPS_SSH_KEY }}" ] && missing+=("VPS_SSH_KEY")
          [ -z "${{ secrets.VPS_PORT }}"    ] && missing+=("VPS_PORT")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "❌ Missing GitHub secrets: ${missing[*]}"
            echo "Run scripts/setup_github_secret.ps1 locally to configure them."
            exit 1
          fi
          echo "✅ All required secrets present"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 10m
          script: |
            set -e
            cd /root/ai-trading-brain
            echo "=== git sync ==="
            # Delete the stale remote-tracking ref before fetching.
            # When a previous manual SSH deploy or a partially-completed Actions
            # run already advanced refs/remotes/origin/main to the NEW sha, git's
            # atomic compare-and-swap transaction fails with:
            #   "cannot lock ref '...': is at NEW but expected OLD"
            # --force only overrides non-fast-forward safety, not this CAS check.
            # Deleting the ref first ensures git creates it fresh with no prior
            # expectation, eliminating the mismatch entirely.
            git update-ref -d refs/remotes/origin/main 2>/dev/null || true
            git fetch origin main
            # Reset to FETCH_HEAD (always set by git fetch regardless of whether
            # the remote-tracking ref was updated) so the working tree is current.
            git reset --hard FETCH_HEAD
            echo "[ git    ] ✅ HEAD=$(git rev-parse --short HEAD)"

            # ═══ Remove stale PID locks ════════════════════════════════════════
            rm -f /root/ai-trading-brain/data/trading_engine.pid
            echo "[ pid    ] ✅ stale locks cleared"

            # ═══ Docker rebuild + restart ══════════════════════════════════════
            touch /root/ai-trading-brain/.env
            docker compose build --no-cache ai-trading-brain 2>&1 | tail -5
            docker compose up -d --force-recreate

            sleep 5
            docker ps --filter name=ai-trading-brain --format "table {{.Names}}\t{{.Status}}"
            echo "✅ Deployment complete — $(git rev-parse --short HEAD) live"

