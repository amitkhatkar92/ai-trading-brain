name: Deploy Trading Brain to VPS

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  deploy-to-vps:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /root/ai-trading-brain
            git fetch origin main
            git reset --hard origin/main

            # ═══════════════════════════════════════════════════════════════════════
            # STEP 1 — SYSTEMD: disable and delete service permanently
            # ═══════════════════════════════════════════════════════════════════════
            systemctl stop    trading-brain-schedule 2>/dev/null || true
            systemctl disable trading-brain-schedule 2>/dev/null || true
            rm -f /etc/systemd/system/trading-brain-schedule.service
            systemctl daemon-reexec 2>/dev/null || true
            systemctl daemon-reload
            echo "[ systemd ] ✅ service removed"

            # ═══════════════════════════════════════════════════════════════════════
            # STEP 2 — CRON: remove any entry that references main.py / trading
            # ═══════════════════════════════════════════════════════════════════════
            # User crontab — strip matching lines in-place
            crontab -l 2>/dev/null \
              | grep -vE "main\.py|ai.trading.brain|autostart" \
              | crontab - 2>/dev/null || true
            # System cron files
            rm -f /etc/cron.d/*trading*   2>/dev/null || true
            rm -f /etc/cron.daily/*trading* 2>/dev/null || true
            # Verify
            REMAINING=$(crontab -l 2>/dev/null | grep -E "main\.py|ai.trading.brain|autostart" || true)
            if [ -z "$REMAINING" ]; then
              echo "[ cron    ] ✅ no trading cron entries"
            else
              echo "[ cron    ] ❌ entries still present: $REMAINING"
            fi

            # ═══════════════════════════════════════════════════════════════════════
            # STEP 3 — SHELL STARTUP FILES: remove auto-launch lines
            # ═══════════════════════════════════════════════════════════════════════
            for f in /root/.bashrc /root/.profile /root/.bash_profile; do
              if [ -f "$f" ]; then
                sed -i '/main\.py/d'       "$f"
                sed -i '/autostart\.sh/d'  "$f"
                sed -i '/ai.trading.brain/d' "$f"
                echo "[ shell  ] ✅ cleaned $f"
              fi
            done

            # ═══════════════════════════════════════════════════════════════════════
            # STEP 4 — Schedule host main.py cleanup via atd (independent of SSH)
            # ─────────────────────────────────────────────────────────────────────
            # nohup+disown caused SIGTERM (the kill ran while still inside the
            # SSH session's process group).  `at` is a system daemon completely
            # independent of any SSH session — zero risk of SIGTERM to deploy.
            # Kill runs 2 minutes after this deploy exits.
            # ═══════════════════════════════════════════════════════════════════════
            if command -v at >/dev/null 2>&1; then
              printf '%s\n' \
                'pkill -TERM -f "python.*main\.py" 2>/dev/null || true' \
                'sleep 5' \
                'pkill -KILL -f "python.*main\.py" 2>/dev/null || true' \
                'echo done > /tmp/kill_main_py.log' \
                | at now + 2 minutes 2>/dev/null
              echo "[ procs  ] ✅ kill scheduled via atd in 2 minutes"
            else
              # atd not available — write a self-deleting cron job instead
              printf '* * * * * root pkill -KILL -f "python.*main\\.py" 2>/dev/null; rm -f /etc/cron.d/kill-main-py\n' \
                > /etc/cron.d/kill-main-py
              echo "[ procs  ] ✅ kill scheduled via cron (self-deleting)"
            fi

            # ═══════════════════════════════════════════════════════════════════════
            # STEP 5 — Remove stale PID locks so Docker start is clean
            # ═══════════════════════════════════════════════════════════════════════
            rm -f /root/ai-trading-brain/data/trading_engine.pid
            echo "[ pid    ] ✅ stale locks cleared"

            # ═══════════════════════════════════════════════════════════════════════
            # STEP 6 — Docker-only restart
            # ═══════════════════════════════════════════════════════════════════════
            docker compose down --remove-orphans 2>/dev/null || true
            docker compose up -d --build

            sleep 3
            docker ps --filter name=ai-trading-brain --format "table {{.Names}}\t{{.Status}}"
            echo "✅ Deployment complete — ONLY Docker runtime active"

